# Настройки ARTurokAI. Все модели скачиваются один раз и дальше работают офлайн.

output_dir: outputs
workspace_dir: workspace

image:
  # FLUX.1-schnell — быстрая и качественная (Apache-2.0). Альтернатива:
  # "stabilityai/stable-diffusion-xl-base-1.0" (меньше VRAM).
  model: black-forest-labs/FLUX.1-schnell
  steps: 4
  guidance: 0.0
  width: 1024
  height: 1024
  cpu_offload: auto          # auto = на видеокарте, если хватает памяти (быстро); true = экономия VRAM

video:
  # Wan 2.2 TI2V-5B умеет и текст->видео, и картинка->видео (продолжение сцены).
  t2v_model: Wan-AI/Wan2.2-TI2V-5B-Diffusers
  i2v_model: Wan-AI/Wan2.2-TI2V-5B-Diffusers
  width: 1280
  height: 704
  fps: 24
  frames_per_segment: 121    # ~5 секунд на сегмент; должно быть 4k+1
  steps: 40
  guidance: 5.0
  max_seconds: 120           # максимум 2 минуты
  cpu_offload: auto

llm:
  # Локальный сервер Ollama (https://ollama.com).
  host: http://127.0.0.1:11434
  fast_model: qwen2.5-coder:7b    # режим «⚡ Быстро» (по умолчанию)
  model: qwen2.5-coder:14b        # режим «🎯 Точно» — для сложных задач
  keep_alive: 60m                 # сколько держать модель в памяти после ответа
  preload: true                   # загрузить быструю модель сразу при запуске сайта
  temperature: 0.3
  num_ctx: 8192                   # контекст без ZIP — меньше значит быстрее
  num_ctx_project: 32768          # контекст, когда загружен ZIP-проект
  max_history: 12                 # сколько последних сообщений помнить в диалоге
  context_chars: 60000            # сколько текста из ZIP передавать модели
  system_prompt: >
    Ты — ARTurokAI, личный ассистент-программист. Отвечай по-русски, быстро и
    понятно: сразу по делу, без вступлений и повторов вопроса. Короткие абзацы,
    списки и шаги вместо длинного текста. Простые слова; термин — с пояснением
    в скобках. Если нужен код — давай полный рабочий код, каждый файл отдельным
    блоком ```язык path/к/файлу, и одной-двумя строками скажи, как запустить.
    Если вопрос неясен — задай один уточняющий вопрос.

zip:
  max_total_mb: 500
  max_files: 5000

# ---------- Аккаунты, тарифы и коды ----------
billing:
  db: data/arturokai.db
  # Где покупать коды — показывается в личном кабинете у тарифов.
  seller_contact: "Напишите в Telegram: @your_username"
  # Сколько кредитов стоит каждое действие.
  costs:
    image: 2            # одно фото (по описанию или по примеру)
    video_second: 3     # каждая секунда видео
    chat: 1             # одно сообщение в разделе «Код»
  plans:
    free:
      name: Бесплатный
      price: "0 ₽"
      credits: 30          # кредитов в день
      reset_days: 1        # каждый день кредиты обновляются
      priority: 2          # место в очереди: меньше — раньше
      max_image_side: 768
      max_images: 1
      video_max_seconds: 0 # 0 — видео недоступно
      chat_modes: [fast]
      zip: false
      includes:
        - "Бесплатные нейросети: FLUX.1-schnell (фото) и Qwen2.5-Coder 7B (код)"
        - "Фото по описанию и по примеру до 768 px"
        - "Код в быстром режиме"
        - "30 кредитов каждый день"
    start:
      name: Старт
      price: "490 ₽ / 30 дней"
      credits: 600
      days: 30
      priority: 1
      max_image_side: 1536
      max_images: 4
      video_max_seconds: 30
      chat_modes: [fast, precise]
      zip: true
      includes:
        - "Фото до 1536 px, до 4 за раз"
        - "Видео до 30 секунд"
        - "Код: быстрый и точный режим, загрузка ZIP"
        - "600 кредитов на 30 дней"
    pro:
      name: Про
      price: "1490 ₽ / 30 дней"
      credits: 2500
      days: 30
      priority: 0
      max_image_side: 2048
      max_images: 4
      video_max_seconds: 120
      chat_modes: [fast, precise]
      zip: true
      includes:
        - "Фото до 2048 px"
        - "Видео до 2 минут"
        - "Приоритет в очереди"
        - "2500 кредитов на 30 дней"
